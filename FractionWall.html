<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction Wall: Level Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* General Styles */
        .fraction-cell {
            transition: all 0.2s ease;
            user-select: none;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            height: 30px;
        }
        @media (max-width: 640px) {
            .fraction-cell { font-size: 0.55rem; height: 24px; }
        }
        .fraction-row { display: flex; width: 100%; margin-bottom: 1px; }
        
        .card-correct { border-color: #22c55e !important; background-color: #f0fdf4 !important; }
        .card-incorrect { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
        
        .sticky-header { position: sticky; top: 0; z-index: 50; }
        
        /* PRINT STYLES */
        @media print {
            @page {
                size: A4;
                margin: 1cm;
            }
            body {
                background-color: white !important;
                padding-bottom: 0 !important;
            }
            .no-print, .sticky-header, #footer-actions, #level-intro, .toast, .sign-buttons {
                display: none !important;
            }
            #game-container {
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .question-card {
                border: 1px solid #ddd !important;
                box-shadow: none !important;
                margin-bottom: 20px !important;
                page-break-inside: avoid;
                height: 45vh; /* Roughly half a page */
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            /* Force 2 questions per page */
            .question-card:nth-child(even) {
                page-break-after: always;
            }
            .fraction-cell {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            h1, #level-badge {
                display: block !important;
                text-align: center;
            }
            #questions-list {
                space-y: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 pb-20">

    <!-- Sticky Header -->
    <div class="sticky-header bg-white shadow-md p-4 mb-6 no-print">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-600">Fraction Wall</h1>
                <div id="level-badge" class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded-full uppercase mt-1">Level 1: Same Numerators</div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
                        <path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm1 5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5V8zm0 4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v1H5v-1z"/>
                    </svg>
                    Print PDF
                </button>
                <div class="text-sm font-bold text-slate-500" id="score-counter">Correct: 0 / 10</div>
                <div class="w-32 md:w-48 bg-slate-200 h-3 rounded-full overflow-hidden">
                    <div id="master-progress" class="bg-indigo-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="game-container" class="max-w-4xl mx-auto px-4">
        <!-- Level Intro -->
        <div id="level-intro" class="mb-8 p-6 bg-white rounded-xl border-l-4 border-indigo-500 shadow-sm no-print">
            <h2 id="intro-title" class="text-xl font-bold mb-1 text-slate-800">Level 1 Challenge</h2>
            <p id="intro-desc" class="text-slate-600 text-sm">In this level, the top numbers (numerators) are the same. Look closely at the wall!</p>
        </div>

        <!-- Questions Container -->
        <div id="questions-list" class="space-y-8">
            <!-- 10 Questions injected here -->
        </div>

        <!-- Footer Actions -->
        <div id="footer-actions" class="mt-12 p-8 bg-white rounded-2xl shadow-xl text-center border-t-4 border-indigo-500 no-print">
            <div id="final-feedback" class="hidden mb-6">
                <div id="encouragement-icon" class="text-6xl mb-4">🏆</div>
                <h2 id="congrats-title" class="text-3xl font-bold text-slate-800 mb-2">Level Complete!</h2>
                <p id="congrats-msg" class="text-slate-600 text-lg mb-4">You've unlocked Level 2!</p>
            </div>

            <button id="submit-all-btn" onclick="checkAllAnswers()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-12 rounded-full shadow-lg transform transition active:scale-95 text-xl">
                Submit All Questions
            </button>
            
            <button id="next-level-btn" onclick="goToLevel2()" class="hidden bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-12 rounded-full shadow-lg transform transition active:scale-95 text-xl">
                Unlock Level 2
            </button>

            <button id="restart-btn" onclick="initGame(1)" class="hidden mt-4 text-indigo-600 font-bold hover:underline">
                Restart from Level 1
            </button>
        </div>
    </div>

    <!-- Feedback Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl text-white font-bold opacity-0 transition-all duration-300 pointer-events-none z-50"></div>

    <script>
        let questions = [];
        let currentLevel = 1;
        const TOTAL_QUESTIONS = 10;
        const colors = [
            '#f87171', '#fb923c', '#fbbf24', '#facc15', 
            '#a3e635', '#4ade80', '#34d399', '#22d3ee', 
            '#38bdf8', '#60a5fa', '#818cf8', '#a78bfa'
        ];

        function initGame(level) {
            currentLevel = level;
            questions = [];
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            const badge = document.getElementById('level-badge');
            const introTitle = document.getElementById('intro-title');
            const introDesc = document.getElementById('intro-desc');
            
            if (level === 1) {
                badge.innerText = "Level 1: Same Numerators";
                introTitle.innerText = "Level 1 Challenge";
                introDesc.innerText = "In this level, the numerators are the same. Use the wall to see how the bottom numbers change the size!";
            } else {
                badge.innerText = "Level 2: Mixed Fractions";
                introTitle.innerText = "Level 2 Challenge";
                introDesc.innerText = "Now both the top and bottom numbers can be different. Use the wall to compare carefully.";
            }

            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                questions.push(generateQuestion(i, level));
            }
            
            renderAllQuestions();
            updateUI();
            
            document.getElementById('submit-all-btn').classList.remove('hidden');
            document.getElementById('next-level-btn').classList.add('hidden');
            document.getElementById('final-feedback').classList.add('hidden');
            document.getElementById('restart-btn').classList.toggle('hidden', level === 1);
        }

        function generateQuestion(id, level) {
            let n1, d1, n2, d2;
            if (level === 1) {
                d1 = Math.floor(Math.random() * 11) + 2;
                d2 = Math.floor(Math.random() * 11) + 2;
                while (d2 === d1) d2 = Math.floor(Math.random() * 11) + 2;
                const maxN = Math.min(d1, d2);
                n1 = Math.floor(Math.random() * maxN) + 1;
                n2 = n1;
            } else {
                d1 = Math.floor(Math.random() * 12) + 1;
                n1 = Math.floor(Math.random() * d1) + 1;
                d2 = Math.floor(Math.random() * 12) + 1;
                n2 = Math.floor(Math.random() * d2) + 1;
            }
            return {
                id: id,
                f1: { n: n1, d: d1 },
                f2: { n: n2, d: d2 },
                userSign: null,
                userWall: Array(13).fill(0),
                status: 'pending'
            };
        }

        function renderAllQuestions() {
            const list = document.getElementById('questions-list');
            list.innerHTML = '';

            questions.forEach((q, idx) => {
                const card = document.createElement('div');
                card.id = `card-${idx}`;
                card.className = "question-card bg-white rounded-2xl shadow-lg p-6 border-2 border-transparent transition-all duration-300";
                
                card.innerHTML = `
                    <div class="flex flex-col lg:flex-row gap-6">
                        <div class="lg:w-1/4 flex flex-col items-center justify-center border-b lg:border-b-0 lg:border-r border-slate-100 pb-6 lg:pb-0 lg:pr-6">
                            <span class="text-xs font-bold text-slate-400 uppercase mb-4 tracking-widest">Question ${idx + 1}</span>
                            <div class="flex items-center gap-4 mb-6">
                                <div class="flex flex-col items-center">
                                    <div class="text-3xl font-bold border-b-4 border-slate-800 px-2 leading-none pb-1">${q.f1.n}</div>
                                    <div class="text-3xl font-bold px-2 leading-none pt-1">${q.f1.d}</div>
                                </div>
                                <div id="sign-display-${idx}" class="w-12 h-12 bg-slate-100 rounded-lg flex items-center justify-center text-3xl font-bold text-indigo-600 border border-slate-200">?</div>
                                <div class="flex flex-col items-center">
                                    <div class="text-3xl font-bold border-b-4 border-slate-800 px-2 leading-none pb-1">${q.f2.n}</div>
                                    <div class="text-3xl font-bold px-2 leading-none pt-1">${q.f2.d}</div>
                                </div>
                            </div>
                            <div class="flex gap-2 sign-buttons">
                                ${['<', '=', '>'].map(s => `
                                    <button onclick="setSign(${idx}, '${s}')" class="w-12 h-12 bg-white border-2 border-slate-200 rounded-xl hover:bg-indigo-50 hover:border-indigo-500 font-bold transition-all text-xl">${s}</button>
                                `).join('')}
                            </div>
                            <div id="status-msg-${idx}" class="mt-4 font-bold text-sm hidden no-print"></div>
                        </div>
                        <div class="lg:w-3/4">
                            <p class="text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">Color ${q.f1.n}/${q.f1.d} and ${q.f2.n}/${q.f2.d}</p>
                            <div id="wall-${idx}" class="flex flex-col"></div>
                        </div>
                    </div>
                `;
                list.appendChild(card);
                renderWall(idx);
            });
        }

        function renderWall(qIdx) {
            const q = questions[qIdx];
            const wallContainer = document.getElementById(`wall-${qIdx}`);
            wallContainer.innerHTML = '';

            for (let d = 1; d <= 12; d++) {
                const row = document.createElement('div');
                row.className = 'fraction-row';
                const isRelevant = (d === q.f1.d || d === q.f2.d);
                
                for (let n = 1; n <= d; n++) {
                    const cell = document.createElement('div');
                    cell.className = 'fraction-cell';
                    cell.style.width = (100 / d) + '%';
                    
                    if (d === 1) cell.innerText = '1';
                    else cell.innerHTML = `<span class="flex flex-col items-center leading-none"><span>1</span><span class="border-t border-current w-2"></span><span>${d}</span></span>`;

                    const isColored = n <= q.userWall[d];
                    if (isColored) {
                        cell.style.backgroundColor = colors[d-1];
                        cell.style.color = 'white';
                    } else {
                        cell.style.backgroundColor = 'white';
                        cell.style.color = isRelevant ? '#64748b' : '#e2e8f0';
                        cell.style.borderColor = isRelevant ? '#cbd5e1' : '#f1f5f9';
                    }

                    cell.onclick = () => {
                        q.userWall[d] = (q.userWall[d] === n) ? 0 : n;
                        renderWall(qIdx);
                        if(q.status !== 'pending') q.status = 'pending';
                        updateUI();
                    };
                    row.appendChild(cell);
                }
                wallContainer.appendChild(row);
            }
        }

        function setSign(qIdx, sign) {
            questions[qIdx].userSign = sign;
            const display = document.getElementById(`sign-display-${qIdx}`);
            display.innerText = sign;
            display.className = "w-12 h-12 bg-indigo-600 rounded-lg flex items-center justify-center text-3xl font-bold text-white shadow-lg transform scale-110 transition-all";
            if(questions[qIdx].status !== 'pending') questions[qIdx].status = 'pending';
            updateUI();
        }

        function checkAllAnswers() {
            let correctCount = 0;
            questions.forEach((q, idx) => {
                const wallF1Correct = q.userWall[q.f1.d] === q.f1.n;
                const wallF2Correct = q.userWall[q.f2.d] === q.f2.n;
                const val1 = q.f1.n / q.f1.d;
                const val2 = q.f2.n / q.f2.d;
                let mathSign = '=';
                if (val1 < val2 - 0.0001) mathSign = '<';
                if (val1 > val2 + 0.0001) mathSign = '>';
                
                const signCorrect = (q.userSign === mathSign);
                if (wallF1Correct && wallF2Correct && signCorrect) {
                    q.status = 'correct';
                    correctCount++;
                } else {
                    q.status = 'incorrect';
                }
                
                const card = document.getElementById(`card-${idx}`);
                const msg = document.getElementById(`status-msg-${idx}`);
                msg.classList.remove('hidden');

                if (q.status === 'correct') {
                    card.className = "question-card bg-white rounded-2xl shadow-lg p-6 border-2 transition-all duration-300 card-correct";
                    msg.innerText = "✓ Correct!";
                    msg.className = "mt-4 font-bold text-sm text-green-600";
                } else {
                    card.className = "question-card bg-white rounded-2xl shadow-lg p-6 border-2 transition-all duration-300 card-incorrect";
                    msg.innerText = "✗ Please check this one!";
                    msg.className = "mt-4 font-bold text-sm text-red-600";
                }
            });

            if (correctCount === TOTAL_QUESTIONS) {
                document.getElementById('submit-all-btn').classList.add('hidden');
                document.getElementById('final-feedback').classList.remove('hidden');
                if (currentLevel === 1) {
                    document.getElementById('next-level-btn').classList.remove('hidden');
                }
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }
            updateUI();
        }

        function goToLevel2() { initGame(2); }

        function updateUI() {
            const solved = questions.filter(q => q.status === 'correct').length;
            const progress = (solved / TOTAL_QUESTIONS) * 100;
            document.getElementById('score-counter').innerText = `Correct: ${solved} / ${TOTAL_QUESTIONS}`;
            document.getElementById('master-progress').style.width = progress + '%';
        }

        function showToast(msg, colorClass) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed bottom-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl text-white font-bold opacity-100 transition-all duration-300 z-50 ${colorClass}`;
            setTimeout(() => toast.style.opacity = '0', 3000);
        }

        window.onload = () => initGame(1);
    </script>
</body>
</html>
